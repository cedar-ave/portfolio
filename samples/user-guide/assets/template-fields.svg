<svg xmlns="http://www.w3.org/2000/svg" width="1244" height="500" viewBox="0 0 1244 500" font-family="Arial, Helvetica, sans-serif">
  <rect width="1244" height="500" fill="white"/>

  <!-- top tabs -->
  <text x="18" y="28" font-size="16" font-weight="bold">Template</text>
  <line x1="12" y1="38" x2="112" y2="38" stroke="#0b5cab" stroke-width="2"/>
  <text x="140" y="28" font-size="16" fill="#555">Setup</text>
  <line x1="0" y1="48" x2="1244" y2="48" stroke="#ddd"/>

  <!-- header row -->
  <rect x="12" y="62" width="24" height="24" rx="4" fill="#0b5cab"/>
  <text x="48" y="80" font-size="20" font-weight="bold">Roster Templates</text>

  <text x="12" y="112" font-size="17" font-weight="bold">Carrier Organization</text>
  <text x="196" y="112" font-size="14">&#9998;</text>
  <rect x="216" y="96" width="130" height="24" rx="12" fill="#eee" stroke="#ccc"/>
  <text x="281" y="113" text-anchor="middle" font-size="12">Account &amp; Contact</text>

  <!-- toggle + buttons -->
  <rect x="1022" y="92" width="52" height="26" rx="13" fill="white" stroke="#ccc"/>
  <circle cx="1034" cy="105" r="10" fill="#ccc"/>
  <text x="1048" y="132" font-size="11" fill="#777">Inactive</text>
  <rect x="1090" y="92" width="64" height="30" rx="4" fill="white" stroke="#ccc"/>
  <text x="1122" y="112" text-anchor="middle" font-size="13">Close</text>
  <rect x="1166" y="92" width="64" height="30" rx="4" fill="#0b5cab"/>
  <text x="1198" y="112" text-anchor="middle" font-size="13" fill="white">Save</text>

  <line x1="0" y1="146" x2="1244" y2="146" stroke="#ddd"/>

  <!-- Available Fields column -->
  <rect x="12" y="156" width="270" height="20" fill="white" stroke="#ccc"/>
  <text x="20" y="170" font-size="12" fill="#999">Search All Fields...</text>

  <text x="12" y="206" font-size="15" font-weight="bold">Available Fields</text>
  <text x="12" y="224" font-size="11" fill="#777">Drag Fields you want to include to the Template</text>
  <text x="12" y="238" font-size="11" fill="#777">Columns section on the right</text>

  <g font-size="13">
    <rect x="12" y="250" width="252" height="24" fill="#f3f3f3"/>
    <text x="22" y="267">Contact ID</text>
    <rect x="12" y="278" width="252" height="24" fill="#f3f3f3"/>
    <text x="22" y="295">Deleted</text>
    <rect x="12" y="306" width="252" height="24" fill="#f3f3f3"/>
    <text x="22" y="323">Master Record ID</text>
    <rect x="12" y="334" width="252" height="24" fill="#f3f3f3"/>
    <text x="22" y="351">Account ID</text>
    <rect x="12" y="362" width="252" height="24" fill="#f3f3f3"/>
    <text x="22" y="379">Is Person Account</text>
    <rect x="12" y="390" width="252" height="24" fill="#f3f3f3"/>
    <text x="22" y="407">Salutation</text>
    <rect x="12" y="418" width="252" height="24" fill="#f3f3f3"/>
    <text x="22" y="435">Full Name</text>
    <rect x="12" y="446" width="252" height="24" fill="#f3f3f3"/>
    <text x="22" y="463">Other Street</text>
  </g>

  <!-- Templates Columns -->
  <text x="308" y="206" font-size="15" font-weight="bold">Templates Columns</text>
  <text x="308" y="224" font-size="11" fill="#777">These fields will be included in the roster</text>
  <text x="308" y="238" font-size="11" fill="#777">template</text>

  <rect x="308" y="250" width="276" height="330" fill="white" stroke="#ddd" stroke-dasharray="4"/>
  <g font-size="13">
    <rect x="316" y="258" width="260" height="26" fill="#eee" stroke="#ccc"/>
    <text x="326" y="276">NPN</text>
    <text x="566" y="276">&#10005;</text>
    <rect x="316" y="290" width="260" height="26" fill="#eee" stroke="#ccc"/>
    <text x="326" y="308">SSN</text>
    <text x="566" y="308">&#10005;</text>
    <rect x="316" y="322" width="260" height="26" fill="#eee" stroke="#ccc"/>
    <text x="326" y="340">First Name</text>
    <text x="566" y="340">&#10005;</text>
    <rect x="316" y="354" width="260" height="26" fill="#eee" stroke="#ccc"/>
    <text x="326" y="372">Last Name</text>
    <text x="566" y="372">&#10005;</text>
    <rect x="316" y="386" width="260" height="26" fill="#eee" stroke="#ccc"/>
    <text x="326" y="404">Email</text>
    <text x="566" y="404">&#10005;</text>
    <rect x="316" y="418" width="260" height="26" fill="#eee" stroke="#ccc"/>
    <text x="326" y="436">License</text>
    <text x="566" y="436">&#10005;</text>
  </g>

  <!-- Preview panel -->
  <line x1="604" y1="146" x2="604" y2="500" stroke="#ddd"/>
  <text x="624" y="178" font-size="17" font-weight="bold">Preview</text>

  <g font-size="12">
    <rect x="624" y="192" width="600" height="26" fill="#f6f6f6" stroke="#ddd"/>
    <text x="632" y="210" font-weight="bold">NPN</text>
    <text x="712" y="210" font-weight="bold">SSN</text>
    <text x="792" y="210" font-weight="bold">First Name</text>
    <text x="892" y="210" font-weight="bold">Last Name</text>
    <text x="992" y="210" font-weight="bold">Email</text>
    <text x="1092" y="210" font-weight="bold">License</text>

    <rect x="624" y="218" width="600" height="26" fill="white" stroke="#ddd"/>
    <text x="630" y="236">1</text>
    <text x="662" y="236" fill="#2e7d32">NPN</text>
    <text x="712" y="236" fill="#2e7d32">SSN</text>
    <text x="792" y="236" fill="#2e7d32">FIRST NAME</text>
    <text x="892" y="236" fill="#2e7d32">LAST NAME</text>
    <text x="992" y="236" fill="#2e7d32">EMAIL</text>
    <text x="1092" y="236" fill="#2e7d32">LICENSE</text>
  </g>
</svg>
