<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="1080" height="470" fill="white"/>

  <!-- Account (Carrier) -->
  <rect x="490" y="15" width="150" height="80" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="565" y="60" text-anchor="middle" font-size="15">Account</text>
  <text x="565" y="78" text-anchor="middle" font-size="15">(Carrier)</text>

  <!-- Contact (Producer) -->
  <rect x="470" y="190" width="190" height="80" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="565" y="225" text-anchor="middle" font-size="15">Contact</text>
  <text x="565" y="243" text-anchor="middle" font-size="15">(Producer)</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>
  <path d="M565,190 L565,98" fill="none" stroke="black" marker-end="url(#arrow2)"/>

  <!-- Sub-objects -->
  <g font-size="14" text-anchor="middle">
    <rect x="30" y="330" width="120" height="70" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="90" y="370">Education</text>

    <rect x="190" y="330" width="120" height="70" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="250" y="370">Training</text>

    <rect x="350" y="330" width="150" height="70" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="425" y="358">Branch</text>
    <text x="425" y="378">Locations</text>

    <rect x="540" y="330" width="130" height="70" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="605" y="370">Designations</text>

    <rect x="710" y="330" width="110" height="70" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="765" y="370">License</text>

    <rect x="850" y="330" width="150" height="70" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="925" y="358">Non-Resident</text>
    <text x="925" y="378">Licenses</text>

    <rect x="900" y="150" width="150" height="70" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="975" y="178">E&amp;O</text>
    <text x="975" y="198">Insurance</text>
  </g>

  <!-- connecting lines into Contact box -->
  <path d="M90,330 L90,300 L470,230" fill="none" stroke="black"/>
  <path d="M250,330 L250,300 L470,235" fill="none" stroke="black" marker-end="url(#arrow2)"/>
  <path d="M90,300 L90,310" fill="none" stroke="black" marker-end="url(#arrow2)"/>
  <path d="M425,330 L565,270" fill="none" stroke="black" marker-end="url(#arrow2)"/>
  <path d="M605,330 L565,270" fill="none" stroke="black"/>
  <path d="M765,330 L660,250" fill="none" stroke="black" marker-end="url(#arrow2)"/>
  <path d="M925,330 L660,245" fill="none" stroke="black"/>
  <path d="M900,185 L660,220" fill="none" stroke="black" marker-end="url(#arrow2)"/>
</svg>
