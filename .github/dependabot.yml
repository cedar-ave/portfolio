# Weekly update pull requests for npm packages and GitHub Actions. Actions
# are pinned to commit SHAs; Dependabot updates the SHA and the version
# comment together.
version: 2
updates:
  - package-ecosystem: npm
    # The tools/ folders pin CI tools with their own lockfiles.
    directories:
      - /
      - /tools/afdocs
      - /tools/netlify-cli
      - /tools/resume-pdf
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
