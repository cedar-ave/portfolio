# Lints the site's prose before it publishes.
#
# - codespell checks for common misspellings. Add false positives to
#   ignore-words-list in .codespellrc.
# - lychee checks links to other sites. Settings are in lychee.toml.
# - Vale checks for defects such as repeated words and leftover merge conflict
#   markers. Rules live in .vale/styles. Only error-level alerts fail
#   the run; warnings and suggestions show up as annotations.
#
# Netlify builds on every push no matter what this workflow reports. To make
# these checks block publishing, either merge to main through pull requests
# with these checks required, or turn on the deploy job below.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  VALE_VERSION: 3.24.0

jobs:
  spelling:
    name: Spelling (codespell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads its settings from .codespellrc.
      - uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3

  links:
    name: Links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads its settings from lychee.toml. The report appears on the run's
      # summary page.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            README.md
            'docs/**/*.md*'
            'blog/**/*.md*'
            'samples/**/*.md*'
            'src/**/*.md*'

  style:
    name: Style (Vale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Vale needs mdx2vast on the PATH to parse .mdx files.
      - name: Install Vale and mdx2vast
        run: |
          npm install --global --ignore-scripts mdx2vast@0.5.0
          curl -sSfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Vale
        run: vale --output=.vale/github.tmpl docs blog samples src/pages README.md

  # Optional: publish to Netlify from here, only after all checks pass.
  # Off until the repository variable NETLIFY_DEPLOY_FROM_ACTIONS is "true".
  # Before turning it on, stop builds in Netlify (Site configuration > Build &
  # deploy > Continuous deployment > Stop builds) so pushes don't also deploy,
  # and add the NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets.
  deploy:
    name: Deploy to Netlify
    needs: [spelling, links, style]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NETLIFY_DEPLOY_FROM_ACTIONS == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: netlify-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Prints the built /resume page to build/pdf/resume.pdf, so the PDF
      # always matches the page. Playwright installs from its own lockfile
      # (tools/resume-pdf), like the Netlify CLI below.
      - name: Make the resume PDF
        run: |
          npm ci --ignore-scripts --prefix tools/resume-pdf
          tools/resume-pdf/node_modules/.bin/playwright install --with-deps chromium
          node tools/resume-pdf/make-pdf.mjs

      # The Netlify CLI installs from its own lockfile (tools/netlify-cli),
      # so the job that holds the Netlify token only runs exact,
      # integrity-checked packages, with install scripts off.
      - run: npm ci --ignore-scripts --prefix tools/netlify-cli

      - name: Publish
        run: tools/netlify-cli/node_modules/.bin/netlify deploy --prod --dir=build --message "Deploy ${GITHUB_SHA::7} from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
