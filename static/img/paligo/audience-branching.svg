<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Roboto, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Shared parent topic with audience-specific child topics embedded inside it</title>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5e7893"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <text x="40" y="44" font-size="13" font-weight="700" fill="#5e7893" letter-spacing="1.2">SHARED WHERE IT'S THE SAME, SPLIT WHERE IT DIFFERS</text>
  <text x="40" y="68" font-size="15" fill="#202b49">One parent topic holds what every reader needs. Embedded child topics hold what only some readers need.</text>

  <!-- Parent -->
  <rect x="40" y="92" width="920" height="120" rx="12" fill="#202b49"/>
  <text x="64" y="124" font-size="17" font-weight="600" fill="#ffffff">Parent topic: Evaluate a databank report</text>
  <rect x="64" y="140" width="420" height="52" rx="8" fill="#5e7893"/>
  <text x="80" y="162" font-size="13" font-weight="700" fill="#ffffff">NOTE · shared</text>
  <text x="80" y="181" font-size="13" fill="#eef4fa">Evaluate reports case by case, with the provider's disclosures.</text>
  <rect x="500" y="140" width="436" height="52" rx="8" fill="#d06e6a"/>
  <text x="516" y="162" font-size="13" font-weight="700" fill="#ffffff">IMPORTANT · shared</text>
  <text x="516" y="181" font-size="13" fill="#ffffff">Report data is confidential. Share only with a valid use case.</text>

  <path d="M280 214 L 280 252" stroke="#5e7893" stroke-width="2" fill="none" marker-end="url(#a3)"/>
  <path d="M720 214 L 720 252" stroke="#5e7893" stroke-width="2" fill="none" marker-end="url(#a3)"/>
  <text x="290" y="238" font-size="12.5" fill="#5e7893">embedded with xi:include</text>
  <text x="730" y="238" font-size="12.5" fill="#5e7893">embedded with xi:include</text>

  <!-- Children -->
  <rect x="40" y="258" width="470" height="130" rx="12" fill="#f4f8fc" stroke="#93bcdf" stroke-width="2"/>
  <text x="64" y="290" font-size="16" font-weight="600" fill="#202b49">Child: If your organization credentials</text>
  <text x="64" y="310" font-size="16" font-weight="600" fill="#202b49">its own providers</text>
  <text x="64" y="338" font-size="13.5" fill="#5e7893">Steps your credentialing staff take to review</text>
  <text x="64" y="357" font-size="13.5" fill="#5e7893">the report and decide next steps.</text>

  <rect x="530" y="258" width="430" height="130" rx="12" fill="#f4f8fc" stroke="#73d3c3" stroke-width="2"/>
  <text x="554" y="290" font-size="16" font-weight="600" fill="#202b49">Child: If a verification team</text>
  <text x="554" y="310" font-size="16" font-weight="600" fill="#202b49">credentials providers for you</text>
  <text x="554" y="338" font-size="13.5" fill="#5e7893">What the outsourced team does, and what</text>
  <text x="554" y="357" font-size="13.5" fill="#5e7893">your organization still needs to do.</text>
</svg>
