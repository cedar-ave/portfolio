<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Roboto, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Anatomy of one topic: the DocBook XML source with a reused admonition, an image variable, and an ID-based cross-reference, and the article it becomes</title>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d06e6a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="40" y="44" font-size="13" font-weight="700" fill="#5e7893" letter-spacing="1.2">SOURCE (SIMPLIFIED DOCBOOK XML)</text>
  <text x="560" y="44" font-size="13" font-weight="700" fill="#5e7893" letter-spacing="1.2">WHAT THE READER SEES</text>

  <!-- Source panel -->
  <rect x="40" y="60" width="480" height="470" rx="12" fill="#202b49"/>
  <g font-family="'Roboto Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#e6edf5">
    <text x="60" y="92"><tspan fill="#93bcdf">&lt;section&gt;</tspan></text>
    <text x="76" y="114"><tspan fill="#93bcdf">&lt;title&gt;</tspan>Turn on monitoring<tspan fill="#93bcdf">&lt;/title&gt;</tspan></text>
    <text x="76" y="136"><tspan fill="#93bcdf">&lt;procedure&gt;</tspan></text>
    <text x="92" y="158"><tspan fill="#93bcdf">&lt;step&gt;</tspan></text>
    <text x="108" y="180"><tspan fill="#93bcdf">&lt;para&gt;</tspan>Go to the</text>
    <text x="108" y="200"><tspan fill="#93bcdf">&lt;guilabel&gt;</tspan>Credentials<tspan fill="#93bcdf">&lt;/guilabel&gt;</tspan> tab.<tspan fill="#93bcdf">&lt;/para&gt;</tspan></text>
    <rect x="100" y="210" width="400" height="44" rx="6" fill="#f1b753" fill-opacity="0.18" stroke="#f1b753"/>
    <text x="108" y="229"><tspan fill="#f1b753">&lt;xi:include</tspan> <tspan fill="#73d3c3">href</tspan>=<tspan fill="#f1b753">"UUID-…"</tspan></text>
    <text x="120" y="247"><tspan fill="#bed4e6">&lt;!-- Credentials tab name caution --&gt;</tspan><tspan fill="#f1b753">/&gt;</tspan></text>
    <text x="92" y="276"><tspan fill="#93bcdf">&lt;/step&gt;</tspan></text>
    <text x="92" y="298"><tspan fill="#93bcdf">&lt;step&gt;</tspan></text>
    <text x="108" y="320"><tspan fill="#93bcdf">&lt;para&gt;</tspan>Click the heartbeat icon (</text>
    <rect x="100" y="330" width="400" height="44" rx="6" fill="#73d3c3" fill-opacity="0.16" stroke="#73d3c3"/>
    <text x="108" y="349"><tspan fill="#73d3c3">&lt;imageobject</tspan> <tspan fill="#93bcdf">xinfo:variable</tspan>=<tspan fill="#73d3c3">"monitor"</tspan></text>
    <text x="120" y="367"><tspan fill="#93bcdf">xinfo:varset</tspan>=<tspan fill="#73d3c3">"Icons_App"</tspan><tspan fill="#73d3c3">/&gt;</tspan>) to turn …</text>
    <text x="92" y="396"><tspan fill="#93bcdf">&lt;/step&gt;</tspan></text>
    <text x="76" y="418"><tspan fill="#93bcdf">&lt;/procedure&gt;</tspan></text>
    <text x="76" y="440"><tspan fill="#93bcdf">&lt;note&gt;&lt;para&gt;</tspan>See</text>
    <rect x="84" y="450" width="416" height="26" rx="6" fill="#d06e6a" fill-opacity="0.2" stroke="#d06e6a"/>
    <text x="92" y="468"><tspan fill="#d06e6a">&lt;xref</tspan> <tspan fill="#93bcdf">xlink:href</tspan>=<tspan fill="#d06e6a">"urn:resource:component:407"</tspan><tspan fill="#d06e6a">/&gt;</tspan></text>
    <text x="76" y="496"><tspan fill="#93bcdf">&lt;/para&gt;&lt;/note&gt;</tspan></text>
    <text x="60" y="518"><tspan fill="#93bcdf">&lt;/section&gt;</tspan></text>
  </g>

  <!-- Rendered panel -->
  <rect x="560" y="60" width="400" height="470" rx="12" fill="#ffffff" stroke="#bed4e6" stroke-width="1.5"/>
  <text x="584" y="102" font-size="22" font-weight="600" fill="#202b49">Turn on monitoring</text>
  <g font-size="14" fill="#202124">
    <text x="584" y="140"><tspan font-weight="600">1.</tspan> Go to the <tspan font-weight="600">Credentials</tspan> tab.</text>
    <rect x="604" y="154" width="336" height="66" rx="6" fill="#fff7e8" stroke="#f1b753"/>
    <rect x="604" y="154" width="5" height="66" fill="#f1b753"/>
    <text x="620" y="176" font-size="12.5" font-weight="700" fill="#8a6414">NOTE</text>
    <text x="620" y="196" font-size="13">The name of the Credentials tab may be</text>
    <text x="620" y="212" font-size="13">customized for your organization.</text>

    <text x="584" y="256"><tspan font-weight="600">2.</tspan> Click the heartbeat icon (</text>
    <rect x="759" y="241" width="20" height="20" rx="4" fill="#5f93c7"/>
    <polyline points="762,252 766,252 768,246 771,258 773,251 776,251" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="781" y="256">) to turn</text>
    <text x="602" y="276">on monitoring for a credential.</text>

    <rect x="584" y="300" width="356" height="52" rx="6" fill="#f4f8fc" stroke="#bed4e6"/>
    <text x="600" y="322" font-size="13"><tspan font-weight="700" fill="#5e7893">NOTE</tspan>  See</text>
    <text x="600" y="342" font-size="13" fill="#5f93c7" text-decoration="underline">Change monitoring frequency</text>
  </g>

  <!-- Legend -->
  <g font-size="13">
    <rect x="584" y="380" width="14" height="14" rx="3" fill="#f1b753"/>
    <text x="608" y="392" fill="#202b49"><tspan font-weight="600">Reused admonition.</tspan> Same caution in 35</text>
    <text x="608" y="410" fill="#202b49">topics; one edit updates all of them.</text>
    <rect x="584" y="426" width="14" height="14" rx="3" fill="#73d3c3"/>
    <text x="608" y="438" fill="#202b49"><tspan font-weight="600">Image variable.</tspan> Icon comes from a</text>
    <text x="608" y="456" fill="#202b49">central icon set, not a pasted screenshot.</text>
    <rect x="584" y="472" width="14" height="14" rx="3" fill="#d06e6a"/>
    <text x="608" y="484" fill="#202b49"><tspan font-weight="600">ID-based cross-reference.</tspan> Link text</text>
    <text x="608" y="502" fill="#202b49">and URL resolve at publish, so they stay current.</text>
  </g>
</svg>
