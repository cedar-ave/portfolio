<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Roboto, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Four levels of reuse, from whole topics down to single words, with counts from the content set</title>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="40" y="44" font-size="13" font-weight="700" fill="#5e7893" letter-spacing="1.2">REUSE AT EVERY LEVEL OF GRANULARITY</text>
  <text x="40" y="68" font-size="15" fill="#202b49">Each level answers a different question: what changes, and how often?</text>

  <!-- granularity axis -->
  <line x1="60" y1="104" x2="60" y2="430" stroke="#bed4e6" stroke-width="3"/>
  <text x="72" y="100" font-size="11.5" fill="#5e7893" font-weight="600">LARGER</text>
  <text x="72" y="446" font-size="11.5" fill="#5e7893" font-weight="600">SMALLER</text>

  <!-- Level 1 -->
  <circle cx="60" cy="140" r="9" fill="#202b49"/>
  <rect x="90" y="110" width="870" height="64" rx="10" fill="#202b49"/>
  <text x="110" y="137" font-size="16.5" font-weight="600" fill="#ffffff">Topics in publications (forks)</text>
  <text x="110" y="158" font-size="13.5" fill="#bed4e6">Publications link to topics instead of containing them.</text>
  <text x="940" y="137" font-size="22" font-weight="700" fill="#73d3c3" text-anchor="end">188 forks</text>
  <text x="940" y="158" font-size="13" fill="#bed4e6" text-anchor="end">7 topics shared across guides</text>

  <!-- Level 2 -->
  <circle cx="60" cy="224" r="9" fill="#5e7893"/>
  <rect x="90" y="194" width="870" height="64" rx="10" fill="#5e7893"/>
  <text x="110" y="221" font-size="16.5" font-weight="600" fill="#ffffff">Topics inside topics (embedded components)</text>
  <text x="110" y="242" font-size="13.5" fill="#eef4fa">One procedure, written once, embedded wherever a task needs it.</text>
  <text x="940" y="221" font-size="22" font-weight="700" fill="#ffffff" text-anchor="end">144 embeds</text>
  <text x="940" y="242" font-size="13" fill="#eef4fa" text-anchor="end">one short task reused in 6 places</text>

  <!-- Level 3 -->
  <circle cx="60" cy="308" r="9" fill="#93bcdf"/>
  <rect x="90" y="278" width="870" height="64" rx="10" fill="#93bcdf"/>
  <text x="110" y="305" font-size="16.5" font-weight="600" fill="#202b49">Reusable admonitions (informal topics)</text>
  <text x="110" y="326" font-size="13.5" fill="#202b49">Cautions and notes that must say exactly the same thing everywhere.</text>
  <text x="940" y="305" font-size="22" font-weight="700" fill="#202b49" text-anchor="end">15 → 99 placements</text>
  <text x="940" y="326" font-size="13" fill="#202b49" text-anchor="end">one caution in 35 topics</text>

  <!-- Level 4 -->
  <circle cx="60" cy="392" r="9" fill="#f1b753"/>
  <rect x="90" y="362" width="870" height="64" rx="10" fill="#f1b753"/>
  <text x="110" y="389" font-size="16.5" font-weight="600" fill="#202b49">Variables (text and image)</text>
  <text x="110" y="410" font-size="13.5" fill="#202b49">Product names, role names, and UI icons that change when the product does.</text>
  <text x="940" y="389" font-size="22" font-weight="700" fill="#202b49" text-anchor="end">116 placements</text>
  <text x="940" y="410" font-size="13" fill="#202b49" text-anchor="end">across 4 variable sets</text>
</svg>
