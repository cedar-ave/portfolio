<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Roboto, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Single-source content model: reusable building blocks are assembled into publications, then published by variant to the help center</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5e7893"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <!-- Column headings -->
  <text x="40" y="44" font-size="13" font-weight="700" fill="#5e7893" letter-spacing="1.2">1 · WRITE ONCE</text>
  <text x="380" y="44" font-size="13" font-weight="700" fill="#5e7893" letter-spacing="1.2">2 · ASSEMBLE</text>
  <text x="700" y="44" font-size="13" font-weight="700" fill="#5e7893" letter-spacing="1.2">3 · PUBLISH</text>
  <text x="40" y="66" font-size="15" fill="#202b49">Reusable components</text>
  <text x="380" y="66" font-size="15" fill="#202b49">Publications built from forks</text>
  <text x="700" y="66" font-size="15" fill="#202b49">Resolved at publish time</text>

  <!-- Column 1: building blocks -->
  <g>
    <rect x="40" y="88" width="280" height="84" rx="10" fill="#202b49"/>
    <text x="60" y="118" font-size="17" font-weight="600" fill="#ffffff">Topics</text>
    <text x="60" y="142" font-size="13.5" fill="#bed4e6">~300 task, concept, and reference</text>
    <text x="60" y="160" font-size="13.5" fill="#bed4e6">topics in DocBook XML</text>

    <rect x="40" y="186" width="280" height="84" rx="10" fill="#5e7893"/>
    <text x="60" y="216" font-size="17" font-weight="600" fill="#ffffff">Reusable admonitions</text>
    <text x="60" y="240" font-size="13.5" fill="#eef4fa">15 notes, tips, and cautions</text>
    <text x="60" y="258" font-size="13.5" fill="#eef4fa">placed 99 times</text>

    <rect x="40" y="284" width="280" height="84" rx="10" fill="#93bcdf"/>
    <text x="60" y="314" font-size="17" font-weight="600" fill="#202b49">Text fragments</text>
    <text x="60" y="338" font-size="13.5" fill="#202b49">~2,000 paragraph, step, and</text>
    <text x="60" y="356" font-size="13.5" fill="#202b49">list-item segments in the database</text>

    <rect x="40" y="382" width="280" height="84" rx="10" fill="#f1b753"/>
    <text x="60" y="412" font-size="17" font-weight="600" fill="#202b49">Variables</text>
    <text x="60" y="436" font-size="13.5" fill="#202b49">4 variable sets: product names,</text>
    <text x="60" y="454" font-size="13.5" fill="#202b49">roles, and two icon image sets</text>
  </g>

  <!-- arrows col1 -> col2 -->
  <path d="M322 180 C 350 180, 350 200, 374 200" fill="none" stroke="#5e7893" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M322 326 C 350 326, 350 300, 374 300" fill="none" stroke="#5e7893" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Column 2: publications -->
  <rect x="380" y="88" width="260" height="378" rx="12" fill="#f4f8fc" stroke="#bed4e6" stroke-width="1.5"/>
  <g font-size="14" fill="#202b49">
    <rect x="398" y="104" width="224" height="42" rx="8" fill="#ffffff" stroke="#93bcdf"/>
    <text x="412" y="130">Salesforce app user guide</text>
    <text x="608" y="130" text-anchor="end" font-size="12" fill="#5e7893">111</text>
    <rect x="398" y="154" width="224" height="42" rx="8" fill="#ffffff" stroke="#93bcdf"/>
    <text x="412" y="180">Roster generation guide</text>
    <text x="608" y="180" text-anchor="end" font-size="12" fill="#5e7893">28</text>
    <rect x="398" y="204" width="224" height="42" rx="8" fill="#ffffff" stroke="#93bcdf"/>
    <text x="412" y="230">Databank monitoring guide</text>
    <text x="608" y="230" text-anchor="end" font-size="12" fill="#5e7893">26</text>
    <rect x="398" y="254" width="224" height="42" rx="8" fill="#ffffff" stroke="#93bcdf"/>
    <text x="412" y="280">Clearinghouse guide</text>
    <text x="608" y="280" text-anchor="end" font-size="12" fill="#5e7893">16</text>
    <rect x="398" y="304" width="224" height="42" rx="8" fill="#ffffff" stroke="#93bcdf"/>
    <text x="412" y="330">Data sources catalog</text>
    <rect x="398" y="354" width="224" height="42" rx="8" fill="#ffffff" stroke="#93bcdf"/>
    <text x="412" y="380">Source fees reference</text>
  </g>
  <text x="510" y="424" font-size="12.5" fill="#5e7893" text-anchor="middle">Numbers = topics linked by forks.</text>
  <text x="510" y="442" font-size="12.5" fill="#5e7893" text-anchor="middle">Topics are linked, never copied.</text>

  <!-- arrow col2 -> col3 -->
  <path d="M642 277 L 694 277" fill="none" stroke="#5e7893" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Column 3: publish-time resolution and output -->
  <g>
    <rect x="700" y="88" width="260" height="254" rx="12" fill="#ffffff" stroke="#73d3c3" stroke-width="2"/>
    <g font-size="13.5">
      <text x="720" y="118" font-weight="600" fill="#202b49">Variables</text>
      <text x="720" y="137" fill="#5e7893">→ current product and role names</text>
      <text x="720" y="170" font-weight="600" fill="#202b49">Image variables</text>
      <text x="720" y="189" fill="#5e7893">→ the right product's UI icons</text>
      <text x="720" y="222" font-weight="600" fill="#202b49">Forks and embedded topics</text>
      <text x="720" y="241" fill="#5e7893">→ article and section hierarchy</text>
      <text x="720" y="274" font-weight="600" fill="#202b49">ID-based cross-references</text>
      <text x="720" y="293" fill="#5e7893">→ working links between articles,</text>
      <text x="720" y="311" fill="#5e7893">   even after titles change</text>
    </g>

    <path d="M830 344 L 830 372" fill="none" stroke="#5e7893" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="700" y="378" width="260" height="88" rx="12" fill="#202b49"/>
    <text x="830" y="410" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Zendesk help center</text>
    <text x="830" y="432" font-size="13" fill="#bed4e6" text-anchor="middle">Publication → category → section</text>
    <text x="830" y="450" font-size="13" fill="#bed4e6" text-anchor="middle">→ article, in one publish step</text>
  </g>

  <text x="500" y="500" font-size="13" fill="#5e7893" text-anchor="middle" font-style="italic">Change a component once, republish, and every publication that uses it updates.</text>
</svg>
