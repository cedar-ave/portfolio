# Build settings (build command, publish directory) are still managed in the
# Netlify UI. This file only holds the redirects below.

# The Norway Data API (cedar-ave/norway-data-api) used to be served from this
# domain through proxy rules. It now has its own domain, api.marlasowards.com,
# so these permanently redirect its old URLs there. The reference page,
# src/pages/api-reference.js, stays on this site.
[[redirects]]
  from = "/api/norway-data/*"
  to = "https://api.marlasowards.com/norway-data/:splat"
  status = 301

[[redirects]]
  from = "/openapi/norway-data.yaml"
  to = "https://api.marlasowards.com/openapi/norway-data.yaml"
  status = 301
